[workspace]
resolver = "2"
members = [
  "crates/one-protocol",
  "crates/one-store",
  "crates/one-adapters",
  "crates/one-exec",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
rusqlite = { version = "0.43", features = ["bundled"] }
one-protocol = { path = "crates/one-protocol" }
one-store = { path = "crates/one-store" }
one-adapters = { path = "crates/one-adapters" }
one-exec = { path = "crates/one-exec" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
