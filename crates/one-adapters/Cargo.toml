[package]
name = "one-adapters"
description = "Adaptadores dos motores (Codex, Claude Code, Cursor): detecção somente leitura, confiança de executáveis e execução com limites"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
one-protocol.workspace = true
# Hash SHA-256 da identidade do executável (RustCrypto; sem dependências nativas).
sha2 = "0.11"
# Grupo de processos (kill(-pgid)), O_NONBLOCK e uid; só Unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true
