[package]
name = "one-chatgpt"
description = "Sign in with ChatGPT Plan Usage for the local OneAgent host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
getrandom = "0.4.3"
keyring = { version = "3.6.3", features = ["apple-native"] }
one-orchestrator.workspace = true
one-protocol.workspace = true
reqwest = { version = "0.13.5", features = ["blocking", "form", "json"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "time", "macros"] }
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }
