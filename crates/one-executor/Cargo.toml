[package]
name = "one-executor"
description = "OneExecutor confiável: executa a CLI aprovada (Codex) sobre um snapshot isolado, pedindo arquivos ao OneNode pelo OneHub Central."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
one-adapters.workspace = true
one-exec.workspace = true
one-node = { path = "../one-node" }
one-protocol.workspace = true
one-store.workspace = true
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde.workspace = true
serde_json.workspace = true
libc = "0.2"

[dev-dependencies]
axum = "0.8"
one-central = { path = "../one-central" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
